default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false

      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false

      - id: pyrefly
        name: Pyrefly type check
        entry: uv run --frozen pyrefly check
        language: system
        pass_filenames: false

      - id: pytest
        name: Pytest
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        stages:
          - pre-push
