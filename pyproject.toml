[project]
name = "prueba-tecnica-emtelco"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.136.3",
    "openai>=1.80.0",
    "pgvector>=0.4.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.9.0",
    "sqlalchemy>=2.0.40",
    "streamlit>=1.45.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
