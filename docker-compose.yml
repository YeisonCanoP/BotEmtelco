services:
  db:
    image: pgvector/pgvector:pg16
    container_name: retail_ai_db
    environment:
      POSTGRES_DB: retail_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d retail_ai" ]
      interval: 5s
      timeout: 5s
      retries: 10

  knowledge-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - app.scripts.ingest_knowledge
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/retail_ai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retail_ai_app
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/retail_ai

      REDIS_URL: redis://redis:6379/0
      REDIS_SESSION_TTL_SECONDS: 86400
      REDIS_SESSION_PREFIX: retail-ai:session

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_VERBOSITY: ${OPENAI_VERBOSITY:-low}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-800}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      KNOWLEDGE_SCORE_THRESHOLD: ${KNOWLEDGE_SCORE_THRESHOLD:-0.30}
      KNOWLEDGE_SCORE_MARGIN: ${KNOWLEDGE_SCORE_MARGIN:-0.10}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIRECTORY: /app/logs
      LOG_FILENAME: app.log
      LOG_MAX_BYTES: 5000000
      LOG_BACKUP_COUNT: 5
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      knowledge-ingestion:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: retail_ai_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: retail_ai_frontend
    command:
      - uv
      - run
      - --no-sync
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      API_BASE_URL: http://app:8000
    ports:
      - "8501:8501"
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
